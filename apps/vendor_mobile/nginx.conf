server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/mime.types;

  types {
    application/wasm wasm;
  }

  # Universal No-Index Header
  add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

  # Gzip compression for faster loading
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

  # Health check endpoint
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'OK';
  }

  # Ensure index.html and service worker are never cached so updates load instantly
  location = /index.html {
    default_type text/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
  }

  location = /flutter_service_worker.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
  }

  # Cache static assets (fonts, icons, canvaskit wasm)
  location ~* \.(?:ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
